name: Frontend gateway bundle

on:
  pull_request:
    paths: ['client/**', 'frontend-gateway/**', '.github/workflows/frontend-gateway.yml']
  push:
    branches: [master]
    paths: ['client/**', 'frontend-gateway/**', '.github/workflows/frontend-gateway.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    if: github.repository == 'ProgrammingDrak/audiobookshelf'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked client dependencies
        working-directory: client
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --ignore-scripts
      - name: Verify gateway and rollback against mock backend
        run: node --test frontend-gateway/test/*.test.mjs
      - name: Verify host-owned Docker update logic
        run: python3 frontend-gateway/test/docker-updater-test.py
      - name: Generate stock frontend
        working-directory: client
        run: npm run generate
      - name: Bundle exact revision with GPL source
        run: node frontend-gateway/bundle.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abs-frontend-${{ github.sha }}
          path: |
            frontend-gateway/out/abs-frontend.tar.gz
            frontend-gateway/out/SHA256SUMS
          retention-days: 7

  docker:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: abs-frontend-${{ github.sha }}
          path: frontend-gateway/out
      - name: Validate and extract the exact source bundle
        working-directory: frontend-gateway/out
        run: |
          sha256sum -c SHA256SUMS
          mkdir bundle
          tar -xzf abs-frontend.tar.gz -C bundle
      - name: Build the non-root frontend image
        env:
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build --check -f frontend-gateway/docker/Dockerfile frontend-gateway/out/bundle
          docker build --platform "linux/${ARCH}" --build-arg "BUILD_REVISION=${REVISION}" \
            -t "abs-frontend:${REVISION}-${ARCH}" -f frontend-gateway/docker/Dockerfile frontend-gateway/out/bundle
      - name: Install test fixture dependencies
        working-directory: client
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --ignore-scripts
      - name: Test the real container and Compose upgrade/rollback
        env:
          ABS_DOCKER_TEST_IMAGE: abs-frontend:${{ github.sha }}-${{ matrix.arch }}
        run: node --test frontend-gateway/test/container.test.mjs
      - name: Export exact image ID and checksum
        env:
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: node frontend-gateway/docker/image-artifact.mjs "abs-frontend:${REVISION}-${ARCH}" frontend-gateway/out "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abs-frontend-docker-${{ matrix.arch }}-${{ github.sha }}
          path: |
            frontend-gateway/out/abs-frontend-${{ matrix.arch }}.docker.tar.gz
            frontend-gateway/out/docker-image-${{ matrix.arch }}.json
          retention-days: 7

  registry:
    # Prepared future channel. Requires owner-reviewed merge and explicit activation.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.FRONTEND_REGISTRY_ENABLED == 'true'
    needs: [bundle, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
      IMAGE: ghcr.io/programmingdrak/audiobookshelf-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: abs-frontend-docker-*-${{ github.sha }}
          merge-multiple: true
          path: tested-images
      - name: Audit exact tested images and GPL corresponding source
        run: python3 frontend-gateway/docker/audit-publish.py tested-images "$REVISION"
      - name: Publish immutable images and advance tested stable channel
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u ProgrammingDrak --password-stdin
          for arch in amd64 arm64; do
            image_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_id"])' "tested-images/docker-image-${arch}.json")
            target="${IMAGE}:frontend-${REVISION}-${arch}"
            if docker manifest inspect "$target" >/dev/null 2>&1; then
              echo "Immutable tag already exists; refusing to replace it."
              exit 1
            fi
            docker tag "$image_id" "$target"
            docker push "$target"
          done
          target="${IMAGE}:frontend-${REVISION}"
          if docker manifest inspect "$target" >/dev/null 2>&1; then
            echo "Immutable index already exists; refusing to replace it."
            exit 1
          fi
          docker manifest create "$target" "${target}-amd64" "${target}-arm64"
          docker manifest push "$target"
          docker manifest create "${IMAGE}:stable" "${target}-amd64" "${target}-arm64"
          docker manifest push "${IMAGE}:stable"
          docker logout ghcr.io

  release:
    # Set only after repository-owner approval; draft PRs cannot publish releases.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.FRONTEND_RELEASES_ENABLED == 'true'
    needs: [bundle, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: abs-frontend-${{ github.sha }}
          path: bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: abs-frontend-docker-*-${{ github.sha }}
          merge-multiple: true
          path: bundle
      - name: Assemble immutable Docker release manifest
        env:
          REVISION: ${{ github.sha }}
        run: node frontend-gateway/docker/release-manifest.mjs bundle "$REVISION"
      - name: Publish versioned frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          tag="frontend-${REVISION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets."
            exit 0
          fi
          gh release create "$tag" bundle/abs-frontend.tar.gz bundle/SHA256SUMS \
            bundle/abs-frontend-amd64.docker.tar.gz bundle/abs-frontend-arm64.docker.tar.gz bundle/docker-release.json \
            --target "$REVISION" --latest --title "ABS frontend ${REVISION}" \
            --notes "Frontend-only Docker gateway for linux/amd64 and linux/arm64. Immutable image IDs/checksums, exact source and GPL license included. Host networking/account access and update activation require separate approval."
